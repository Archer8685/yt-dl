name: Release app

# 把下載器打包成桌面 App（Windows 安裝精靈、macOS .dmg），實際安裝後做啟動測試，再發布到 GitHub Releases。
# 版本號在 VERSION 檔：改了版本號並 push 才會發布 v<版本>；同一版只發布一次。
# yt-dlp 由 App 自己從 PyPI 自動更新，不需要為了 yt-dlp 重新打包。
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag 已發布，略過"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            # 每一版都要有更新說明：CHANGELOG.md 沒寫就在打包前停下來，不浪費時間
            python3 tools/release_notes.py "${tag#v}" > /dev/null
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-app.txt pytest
      - name: Test
        run: python -m pytest -q
      - name: Build
        env:
          # 下載 FFmpeg / Deno 失敗時改走 GitHub API；帶 token 才不會碰到匿名請求的次數限制（403）
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_app.py
      - name: Install the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item dist/YT-Downloader-Setup-Windows.exe
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$env:RUNNER_TEMP\app","/NORESTART" -Wait
          "APP_EXE=$env:RUNNER_TEMP\app\YT-Downloader.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Mount the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/YT-Downloader-*.dmg -mountpoint /Volumes/ytdl -nobrowse
          echo "APP_EXE=/Volumes/ytdl/YT 下載器.app/Contents/MacOS/YT-Downloader" >> "$GITHUB_ENV"
      - name: Smoke test the installed app
        shell: bash
        run: |
          exe="$APP_EXE"
          if command -v cygpath >/dev/null; then exe=$(cygpath -u "$APP_EXE"); fi  # Windows 路徑轉成 bash 路徑
          YTDL_PORT=8799 YTDL_DOWNLOAD_DIR="$RUNNER_TEMP/dl" "$exe" --server &
          for i in $(seq 90); do
            if meta=$(curl -fsS http://127.0.0.1:8799/api/meta); then break; fi; sleep 1
          done
          echo "$meta"
          echo "$meta" | grep -q '"frozen":true'
          echo "$meta" | grep -q '"ffmpeg":true'
          page=$(curl -fsS http://127.0.0.1:8799/)
          grep -q "<html" <<< "$page"
          kill %1 || true
          # yt-dlp 自動更新：App 要能載入使用者資料夾裡的新版（而不是內建版）
          python -m pip download -q --no-deps --only-binary :all: -d "$RUNNER_TEMP/whl" yt-dlp
          python -c "import sys, zipfile, glob; zipfile.ZipFile(glob.glob(sys.argv[1] + '/yt_dlp-*.whl')[0]).extractall(sys.argv[2])" \
            "$RUNNER_TEMP/whl" "$RUNNER_TEMP/overlay"
          "$exe" --check-ytdlp "$RUNNER_TEMP/overlay"
          test -f "$RUNNER_TEMP/overlay/OK"
          # 載入失敗的新版：要很快回報失敗（結束碼非 0），不能跳出錯誤視窗卡住背景的自動更新
          mkdir -p "$RUNNER_TEMP/bad/yt_dlp"
          echo 'raise ImportError("broken on purpose")' > "$RUNNER_TEMP/bad/yt_dlp/__init__.py"
          "$exe" --check-ytdlp "$RUNNER_TEMP/bad" & pid=$!
          for i in $(seq 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "::error::--check-ytdlp 遇到壞掉的版本時卡住"; kill "$pid"; exit 1; fi
          if wait "$pid"; then echo "::error::壞掉的 yt-dlp 被當成可用"; exit 1; fi
          test ! -f "$RUNNER_TEMP/bad/OK"
      - name: GUI smoke test the installed app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen  # CI 沒有螢幕：Qt 畫在記憶體裡
          YTDL_PORT: "8798"
          YTDL_AUTO_UPDATE: "0"
        run: |
          exe="$APP_EXE"
          if command -v cygpath >/dev/null; then exe=$(cygpath -u "$APP_EXE"); fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # 毛玻璃側邊欄需要 PyObjC；缺了 App 只會默默退回一般外觀，所以在這裡確認有打包進去
            app="${APP_EXE%/Contents/MacOS/*}"
            for mod in _objc _AppKit; do
              find "$app" -name "$mod*.so" | grep -q . || { echo "::error::App 裡沒有 $mod（PyObjC）"; exit 1; }
            done
          fi
          # --smoke-test：主視窗顯示後幾秒自動結束，結束碼 0 表示介面正常建立（沒有當掉）
          out="$RUNNER_TEMP/smoke.log"
          YTDL_DOWNLOAD_DIR="$RUNNER_TEMP/dl" "$exe" --smoke-test > "$out" 2>&1 &
          pid=$!
          for i in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          status=0
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::App 在 120 秒內沒有自己結束"; kill "$pid" || true; status=1
          else
            wait "$pid" || status=$?
          fi
          # 有繼承到輸出就寫在 smoke.log；沒有主控台時改寫在使用者資料夾的 engine.log
          if [ "$RUNNER_OS" = "Windows" ]; then log="$LOCALAPPDATA/YT-Downloader/engine.log"
          else log="$HOME/Library/Application Support/YT-Downloader/engine.log"; fi
          grep -v "GET /api/" "$out" || true
          tail -n 40 "$log" 2>/dev/null || true
          if ! grep -qs "smoke test: [1-9]" "$out" "$log"; then echo "::error::沒有看到主視窗"; status=1; fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/YT-Downloader-Setup-Windows.exe
            dist/YT-Downloader-*.dmg

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Release 說明 = CHANGELOG.md 裡這一版的更新內容 + 下載安裝說明
          python3 tools/release_notes.py "${TAG#v}" > notes.md
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "YT 下載器 ${TAG}" --notes-file notes.md --latest
