name: 回報問題 / Bug report
description: App 出錯、下載失敗或行為不對 / Something went wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！送出前請先看 [常見問題](https://github.com/Archer8685/yt-dl/blob/main/USER_GUIDE.md#faq)，很多錯誤訊息都有對應的解法。
        **請不要附上 cookies.txt 或貼出它的內容**：那等於你的帳號登入資料。

        Thanks for reporting! Please check the [FAQ](https://github.com/Archer8685/yt-dl/blob/main/USER_GUIDE.md#faq) first.
        **Never attach or paste your cookies.txt** — it contains your sign-in data.
  - type: checkboxes
    id: checks
    attributes:
      label: 送出前確認 / Before you submit
      options:
        - label: 我看過常見問題（FAQ），沒有找到解法 / I read the FAQ and it did not help
          required: true
        - label: 我沒有附上 cookies.txt，也沒有貼出它的內容 / I did not attach or paste my cookies.txt
          required: true
  - type: input
    id: app_version
    attributes:
      label: App 版本 / App version
      description: 「設定 → 關於」可以看到 / See Settings → About
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 介面語言 / App language
      options:
        - 中文（繁體）
        - English
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系統與晶片 / OS and chip
      description: macOS 請點左上角  →「關於這台 Mac」查看晶片 / On a Mac, see  → About This Mac
      options:
        - Windows 11
        - Windows 10
        - macOS 15（Apple 晶片 / Apple silicon）
        - macOS 14（Apple 晶片 / Apple silicon）
        - 其他（請在下方說明）/ Other (describe below)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 影片網址 / Video URL
      description: 可以重現問題的網址；私人或付費內容請說明類型就好 / A URL that reproduces the problem. For private or paid content, just describe it.
      placeholder: https://www.youtube.com/watch?v=...
  - type: textarea
    id: what
    attributes:
      label: 發生了什麼事？ / What happened?
      description: 你做了什麼、預期會怎樣、實際上怎樣 / What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 錯誤訊息 / Error message
      description: 佇列裡失敗的工作可以展開「詳細資訊」複製原文 / Copy the details from the failed job in the queue
      render: text
  - type: textarea
    id: log
    attributes:
      label: 紀錄檔 engine.log / Log file
      description: |
        Windows：`%LOCALAPPDATA%\YT-Downloader\engine.log`；macOS：`~/Library/Application Support/YT-Downloader/engine.log`。
        可以把檔案拖進這個欄位上傳。**上傳前請先打開看一下**：裡面可能有你的下載網址和資料夾路徑（含電腦使用者名稱），不想公開的部分可以先刪掉。
        Drag the file here to attach it. **Look through it first**: it may contain your download URLs and folder paths (including your user name).
  - type: textarea
    id: extra
    attributes:
      label: 其他補充 / Anything else
      description: 截圖、什麼時候開始發生、有沒有改過設定等 / Screenshots, when it started, settings you changed
